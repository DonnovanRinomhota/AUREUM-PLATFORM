<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUREUM Back Office</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0A1B16;color:#EDE6D2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;text-align:center}
.box{max-width:380px}
.coin{width:84px;height:84px;border-radius:50%;margin:0 auto 20px;background:radial-gradient(circle at 35% 30%,#F3DB8B,#C9A24B 60%,#9A7B2E);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;color:#1b1408}
h1{font-size:20px;margin:0 0 8px;color:#E7C766;letter-spacing:.04em}
p{margin:0 0 18px;line-height:1.5;color:#B8C4BC;font-size:15px}
button{background:#C9A24B;color:#1b1408;border:0;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:700;min-height:48px}
.s{margin-top:16px;font-size:13px;color:#8FA79A}
</style></head><body><div class="box" role="main">
<div class="coin" aria-hidden="true">A</div>
<h1>AUREUM Back Office</h1>
<p id="msg">We can&rsquo;t reach AUREUM right now. Check your internet connection and try again. Anything you already saved on this device is kept safely.</p>
<button id="retry" type="button">Try again</button>
<div class="s" id="st" role="status"></div>
</div>
<script>
var URL_='https://aureum-platform.vercel.app/backoffice.html?store=1&app=backoffice';
function go(){ var st=document.getElementById('st'); st.textContent='Connecting\u2026';
  var c=new AbortController(); var t=setTimeout(function(){c.abort()},6000);
  fetch('https://aureum-platform.vercel.app/app-compat.json?t='+Date.now(),{cache:'no-store',signal:c.signal})
   .then(function(r){clearTimeout(t); if(r.ok){ location.replace(URL_); } else throw 0;})
   .catch(function(){ clearTimeout(t); st.textContent='Still offline. Try again in a moment.'; });
}
document.getElementById('retry').addEventListener('click',go);
window.addEventListener('online',go);
</script></body></html>
