name: Android build
# Builds the two Android apps in GitHub's cloud. Run it by hand: Actions -> Android build -> Run workflow.
# Debug APK (for testing on a phone) is always produced. The signed release bundle (.aab for Google Play) is produced
# only when that app's signing secrets exist (see android/docs/SIGNING.md). Nothing is ever published automatically.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        options: [both, pos, backoffice]
        default: both
      version_code:
        description: "Play versionCode (a whole number higher than the last upload)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users"
        required: true
        default: "1.0.0"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pos, backoffice]
    steps:
      - name: Skip apps that were not chosen
        id: pick
        run: |
          if [ "${{ inputs.app }}" = "both" ] || [ "${{ inputs.app }}" = "${{ matrix.app }}" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.go == 'yes'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: steps.pick.outputs.go == 'yes'
        with: { distribution: temurin, java-version: 21 }
      - name: Install and sync Capacitor
        if: steps.pick.outputs.go == 'yes'
        working-directory: android/${{ matrix.app }}
        run: npm ci && npx cap sync android
      - name: Debug APK
        if: steps.pick.outputs.go == 'yes'
        working-directory: android/${{ matrix.app }}/android
        env:
          AUREUM_VERSION_CODE: ${{ inputs.version_code }}
          AUREUM_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew assembleDebug
      - name: Restore signing key (only if the secrets exist)
        if: steps.pick.outputs.go == 'yes'
        id: key
        env:
          KS: ${{ matrix.app == 'pos' && secrets.POS_KEYSTORE_B64 || secrets.BACKOFFICE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "have=yes" >> "$GITHUB_OUTPUT"; else echo "have=no" >> "$GITHUB_OUTPUT"; fi
      - name: Signed release bundle (.aab)
        if: steps.pick.outputs.go == 'yes' && steps.key.outputs.have == 'yes'
        working-directory: android/${{ matrix.app }}/android
        env:
          AUREUM_VERSION_CODE: ${{ inputs.version_code }}
          AUREUM_VERSION_NAME: ${{ inputs.version_name }}
          AUREUM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          AUREUM_KEYSTORE_PASSWORD: ${{ matrix.app == 'pos' && secrets.POS_KEYSTORE_PASSWORD || secrets.BACKOFFICE_KEYSTORE_PASSWORD }}
          AUREUM_KEY_ALIAS: ${{ matrix.app == 'pos' && secrets.POS_KEY_ALIAS || secrets.BACKOFFICE_KEY_ALIAS }}
          AUREUM_KEY_PASSWORD: ${{ matrix.app == 'pos' && secrets.POS_KEY_PASSWORD || secrets.BACKOFFICE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload files
        if: steps.pick.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: aureum-${{ matrix.app }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
            android/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
